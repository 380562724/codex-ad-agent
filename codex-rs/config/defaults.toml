# Fixed defaults for packaged Codex clients.
include_permissions_instructions = true
include_apps_instructions = true
include_collaboration_mode_instructions = true
include_environment_context = true
cli_auth_credentials_store = "file"
mcp_oauth_credentials_store = "auto"
project_doc_max_bytes = 32768
project_doc_fallback_filenames = []
background_terminal_max_timeout = 300000
file_opener = "vscode"
hide_agent_reasoning = false
# [ad-agent] Keep in sync with codex_login::DEFAULT_CHATGPT_BASE_URL. ChatGPT-backend features
# send the logged-in (Cowork) token to this base URL, so it must never point at chatgpt.com.
chatgpt_base_url = "https://quchenyang.com/backend-api/"
project_root_markers = [".git"]

[history]
persistence = "save-all"
